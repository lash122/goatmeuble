  <script>
    (function () {
      function absolutizeSeo() {
        var base = (window.SITE_URL || location.origin).replace(/\/+$/, '');
        ['og:url', 'og:image'].forEach(function (prop) {
          var el = document.querySelector('meta[property="' + prop + '"], meta[name="' + prop + '"]');
          if (el && el.content && !/^https?:/i.test(el.content)) {
            el.content = base + '/' + el.content.replace(/^\/+/, '');
          }
        });
      }
      if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', absolutizeSeo);
      else absolutizeSeo();
    })();
  </script>

  <header class="site">

      <a class="brand brand-center" href="/">
        <img src="/assets/logo-goat.jpg" alt="GOAT meubles" class="logo-img" style="height:36px;width:auto;object-fit:contain">
        <span class="brand-name">GOAT meubles</span>
      </a>
      <div class="header-right">
        <a class="track-link" href="/track.html"><span class="tl-ico">📦</span><span class="tl-label" data-i18n="track"></span></a>
        <div class="lang-btn-wrap">

            <button data-lang="fr">Français</button>
            <button data-lang="ar">العربية</button>
            <button data-lang="en">English</button>
          </div>
        </div>
        <a class="header-icon cart-btn" href="/checkout.html" aria-label="Cart">

      </div>
    </div>

  <main class="container page-pad">

      <h1 class="section-title" data-i18n="track"></h1>
      <p data-i18n="track_intro"></p>
    </section>

    <div class="panel track-lookup">
      <div class="form-grid">
        <div><label data-i18n="track_id"></label><input id="tId" type="text" inputmode="numeric" placeholder="42"></div>
        <div><label data-i18n="phone"></label><input id="tPhone" type="tel" placeholder="05 XX XX XX XX"></div>
        <div class="error-msg" id="tError"></div>
        <button class="btn-gold" id="tBtn" style="width:100%" data-i18n="track_btn"></button>
      </div>
    </div>

    <div class="panel track-result" id="tResult" hidden></div>
  </main>

  <footer class="site">
    <div class="container">
      <div class="cols" style="grid-template-columns:2fr 1fr;align-items:start">
        <div>
          <h4 style="margin-bottom:8px"><img src="/assets/logo-goat.jpg" alt="GOAT meubles" style="height:40px;width:auto;object-fit:contain"></h4>
          <p data-i18n="hero_sub"></p>
        </div>
        <div>
          <h4 data-i18n="nav_contact"></h4>
          <p id="footerPhone">—</p>
          <div class="social-links" id="socialLinks"></div>
          <a href="/track.html" data-i18n="track"></a>
        </div>
      </div>
      <div class="fine">© <span id="year"></span> GOAT meubles — <span data-i18n="cod_only"></span></div>
    </div>
  </footer>
