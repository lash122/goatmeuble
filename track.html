  <script>
    (function () {
      function absolutizeSeo() {
        var base = (window.SITE_URL || location.origin).replace(/\/+$/, '');
        ['og:url', 'og:image'].forEach(function (prop) {
          var el = document.querySelector('meta[property="' + prop + '"], meta[name="' + prop + '"]');
          if (el && el.content && !/^https?:/i.test(el.content)) {
            el.content = base + '/' + el.content.replace(/^\/+/, '');
          }
        });
      }
      if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', absolutizeSeo);
      else absolutizeSeo();
    })();
  </script>

      <div class="header-actions">

    <div class="panel" style="max-width:440px;margin:0 auto">
      <div class="form-grid">
        <div><label data-i18n="track_id"></label><input id="tId" type="text" inputmode="numeric" placeholder="42"></div>
        <div><label data-i18n="phone"></label><input id="tPhone" type="tel" placeholder="05 XX XX XX XX"></div>
        <div class="error-msg" id="tError"></div>
        <button class="btn-gold" id="tBtn" style="width:100%" data-i18n="track_btn"></button>
      </div>
    </div>

    <div class="panel" id="tResult" hidden style="max-width:440px;margin:22px auto 0"></div>
  </main>

  <footer class="site" style="margin-top:60px">
    <div class="container fine">© <span id="year"></span> Élégance — <span data-i18n="cod_only"></span></div>
  </footer>
