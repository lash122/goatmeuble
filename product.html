<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Produit — GOAT meubles</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link id="fontsCss" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600&family=Inter:wght@400;500;600;700&family=Cairo:wght@400;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
  <link rel="preconnect" href="https://bdvnlqdublfikmadcnev.supabase.co" crossorigin>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="/icon-180.png">
  <meta name="theme-color" content="#3b2f26">
  <!-- The build replaces these with the product's own values. They must EXIST
       here for it to find them: it rewrites tags, it does not invent them, so
       a missing canonical is simply a page with no canonical. -->
  <link rel="canonical" href="/product.html">
  <meta property="og:type" content="product">
  <meta property="og:site_name" content="GOAT meubles">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="stylesheet" href="/css/style.css?v=69">
  <link rel="stylesheet" href="/css/bottomnav.css?v=69">
  <link id="themeCss" rel="stylesheet" href="/css/theme-furniture.css?v=69">
  <link rel="stylesheet" href="/css/product.css?v=69">
</head>
<body>
  <div class="topbar" data-i18n="cod_only"></div>

  <header class="site">
    <div class="container site-inner">
      <div class="header-left"></div>
      <a class="brand brand-center" href="/">
        <img src="/assets/logo-goat.jpg" alt="GOAT meubles" class="logo-img" style="height:36px;width:auto;object-fit:contain">
        <span class="brand-name">GOAT meubles</span>
      </a>
      <div class="header-right">
        <a class="track-link" href="/track.html"><span class="tl-ico">📦</span><span class="tl-label" data-i18n="track"></span></a>
        <div class="lang-btn-wrap">
          <button class="header-icon lang-toggle" id="langToggle" aria-label="Language"><span id="currentLang">FR</span></button>
          <div class="lang-dropdown" id="langDropdown">
            <button data-lang="fr">Français</button>
            <button data-lang="ar">العربية</button>
            <button data-lang="en">English</button>
          </div>
        </div>
        <a class="header-icon cart-btn" href="/checkout.html" aria-label="Cart">
          <svg viewBox="0 0 24 24"><path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 01-8 0"/></svg>
          <span class="cart-count" id="cartCount">0</span>
        </a>
      </div>
    </div>
  </header>

  <main class="pdp">
    <div class="container">
      <!-- Filled at build time so the crawler and the customer both get it
           without waiting for the database. -->
      <nav class="pdp-crumbs" aria-label="Fil d'ariane">
        <a href="./" data-i18n="nav_shop"></a>
        <span>›</span>
        <a id="pdpCrumbCat" href="./"></a>
      </nav>

      <div class="pdp-grid">
        <div class="pdp-media">
          <figure class="pdp-stage">
            <span class="pdp-badge" id="pdpBadge" hidden></span>
            <div class="pdp-photo"><img id="pdpPhoto" alt=""></div>
          </figure>
          <div class="pdp-thumbs" id="pdpThumbs" hidden></div>
        </div>

        <div class="pdp-info">
          <span class="cat" id="pdpCat"></span>
          <h1 id="pdpName"></h1>

          <div class="price-row">
            <span class="price" id="pdpPrice"></span>
            <span class="price-old" id="pdpOld"></span>
            <span class="price-save" id="pdpSave" hidden></span>
          </div>

          <p class="pdp-desc" id="pdpDesc"></p>

          <div id="pdpSizeBlock" class="pdp-sizes-block">
            <div class="size-label"><span data-i18n="select_size"></span></div>
            <div class="sizes" id="pdpSizes"></div>
            <div class="size-error" id="pdpSizeError" data-i18n="size_required"></div>
          </div>

          <div class="buy-row">
            <div class="qty-picker" aria-label="Quantité">
              <button type="button" data-q="-1" aria-label="−">−</button>
              <span id="pdpQty">1</span>
              <button type="button" data-q="1" aria-label="+">+</button>
            </div>
            <button class="btn-gold pdp-add" id="pdpAdd" data-i18n="add_to_cart"></button>
          </div>
          <div class="fd-teaser" id="pdpFdTeaser" hidden></div>
          <div class="m-actions">
            <button class="wl-btn" id="pdpWish" type="button"></button>
            <button class="wl-btn" id="pdpShare" type="button"></button>
          </div>

          <!-- The reassurance a cash-on-delivery buyer is actually looking for,
               on the page instead of two clicks away at checkout. -->
          <ul class="pdp-trust">
            <li><b>💵</b><span data-i18n="cod_only"></span></li>
            <li><b>📞</b><span data-i18n="confirm_call"></span></li>
            <li><b>🚚</b><span data-i18n="wilayas_58"></span></li>
            <li><b>⏱</b><span data-i18n="delivery_time"></span></li>
            <li><b>🔄</b><span data-i18n="exchange_7"></span></li>
            <li><b>🏢</b><span data-i18n="deliv_desk_hint"></span></li>
            <li><b>🏠</b><span data-i18n="deliv_home_hint"></span></li>
          </ul>
        </div>
      </div>

      <section class="pdp-reviews" id="pdpReviewsBlock" hidden>
        <div class="pr-head">
          <h2 class="section-title" data-i18n="reviews_title"></h2>
          <span class="pr-summary" id="pdpReviewSummary"></span>
        </div>
        <ul class="pr-list" id="pdpReviews"></ul>
        <p class="pr-empty" id="pdpNoReviews" hidden data-i18n="review_none"></p>

        <!-- submission: no account, one screen; approval gates publication -->
        <form class="pr-form" id="pdpReviewForm">
          <h3 data-i18n="review_write"></h3>
          <div class="pr-stars-input" id="prStars">
            <button type="button" data-v="1">★</button><button type="button" data-v="2">★</button><button type="button" data-v="3">★</button><button type="button" data-v="4">★</button><button type="button" data-v="5">★</button>
          </div>
          <input id="prName" type="text" maxlength="60" data-i18n-placeholder="review_name" required>
          <textarea id="prBody" rows="3" maxlength="600" data-i18n-placeholder="review_text"></textarea>
          <div class="error-msg" id="prError"></div>
          <button type="submit" class="btn-gold" data-i18n="review_send"></button>
        </form>
      </section>

      <section class="pdp-related" id="pdpRelatedBlock" hidden>
        <h2 class="section-title" data-i18n="related"></h2>
        <div class="product-grid" id="pdpRelated"></div>
      </section>
    </div>
  </main>

  <footer class="site" id="contact">
    <div class="container cols">
      <div>
        <h4><img src="/assets/logo-goat.jpg" alt="GOAT meubles" style="height:36px;width:auto;object-fit:contain"></h4>
        <p style="max-width:260px" data-i18n="hero_sub"></p>
      </div>
      <div>
        <h4 data-i18n="nav_contact"></h4>
        <p id="footerPhone">—</p>
        <div class="social-links" id="socialLinks"></div>
        <a href="track.html" data-i18n="track"></a>
      </div>
    </div>
    <div class="container fine">© <span id="year"></span> GOAT meubles — <span data-i18n="cod_only"></span></div>
  </footer>

  <!-- sticky buy bar on phones, where the button scrolls away -->
  <div class="pdp-sticky" id="pdpSticky" hidden>
    <img id="pdpStickyImg" alt="">
    <div><b id="pdpStickyName"></b><span id="pdpStickyPrice"></span></div>
    <button class="btn-gold" id="pdpStickyAdd" data-i18n="add_to_cart"></button>
  </div>

  <a class="call-fab" id="callFab" hidden aria-label="Appelez-nous">☎</a>
  <a class="wa-float" id="waFloat" hidden target="_blank" rel="noopener noreferrer"></a>

  <!-- fullscreen photo lightbox: opens from the main photo, arrows / swipe /
       Escape to move and close -->
  <div class="lb-overlay" id="pdpLightbox" role="dialog" aria-modal="true" aria-label="Photo">
    <button class="lb-close" id="lbClose" aria-label="Fermer">&times;</button>
    <button class="lb-arrow lb-prev" id="lbPrev" aria-label="Précédente">‹</button>
    <img class="lb-img" id="lbImg" alt="">
    <button class="lb-arrow lb-next" id="lbNext" aria-label="Suivante">›</button>
    <div class="lb-count" id="lbCount"></div>
  </div>

    <!-- phone-only bottom tab bar: home, shop, search, tracking, cart -->
  <nav class="bottom-nav" aria-label="Navigation principale">
    <a href="/" data-bn="home"><span class="bn-ico"><svg class="bn-svg" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10.8 12 3l9 7.8"/><path d="M5.2 9.8V21h13.6V9.8"/><path d="M9.5 21v-6h5v6"/></svg></span><span data-i18n="nav_home"></span></a>
    <a href="/#shop" data-bn="shop"><span class="bn-ico"><svg class="bn-svg" viewBox="0 0 24 24" aria-hidden="true"><path d="M4.5 7.5 5.6 3.5h12.8l1.1 4"/><path d="M4.5 7.5h15v13h-15z"/><path d="M9.5 20.5v-5.5h5v5.5"/></svg></span><span data-i18n="nav_shop"></span></a>
    <a href="/#search" data-bn="search"><span class="bn-ico"><svg class="bn-svg" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.35-4.35"/></svg></span><span data-i18n="bn_search"></span></a>
    <a href="/track.html" data-bn="track"><span class="bn-ico"><svg class="bn-svg" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 8.2 12 3 3 8.2v7.6l9 5.2 9-5.2z"/><path d="m3 8.2 9 5 9-5"/><path d="M12 13.2V21"/></svg></span><span data-i18n="track"></span></a>
    <a href="/checkout.html" data-bn="cart"><span class="bn-ico"><svg class="bn-svg" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><path d="M3 6h18"/><path d="M16 10a4 4 0 0 1-8 0"/></svg></span><span data-i18n="bn_cart"></span><span class="bn-badge nav-cart-count">0</span></a>
  </nav>

<script
    src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.3/dist/umd/supabase.js"
    integrity="sha384-qafw21c/iciq0VXsi9FzkfoQv5I/V0iqE4lSNcKXPnW9/UTJLnv5CcN4FHxVLnKg"
    crossorigin="anonymous" defer></script>
  <script src="/js/config.js?v=69" defer></script>
  <script src="/js/tracking.js?v=69" defer></script>
  <script src="/js/i18n.js?v=69" defer></script>
  <script src="/js/supabase.js?v=69" defer></script>
  <script src="/js/cart.js?v=69" defer></script>
  <script src="/js/store.js?v=69" defer></script>
  <script src="/js/product.js?v=69" defer></script>
  <script src="/js/ux.js?v=69" defer></script>
</body>
</html>
