    async function populate() {
      const btn = document.getElementById('go');
      btn.disabled = true;
      btn.textContent = 'Inserting...';

      const sb = window.supabase.createClient(SUPABASE_CONFIG.url, SUPABASE_CONFIG.anonKey);

      // 1. Insert categories
      msg('Creating categories...');
      const catMap = {};
      for (const cat of CATEGORIES) {
        const { data, error } = await sb.from('categories').insert(
          { name_fr: cat.name_fr, name_en: cat.name_en, name_ar: cat.name_ar }
        ).select('id, name_fr');
        if (error) { msg(`  ✗ ${cat.name_fr}: ${error.message}`, 'err'); continue; }
        if (data && data[0]) catMap[cat.slug] = data[0].id;
        msg(`  ✓ ${cat.name_fr} (id: ${catMap[cat.slug]})`);
      }

      // 2. Insert products
      msg('\nInserting products...');
      for (const p of PRODUCTS) {
        const catId = catMap[p.cat] || null;
        const { data, error } = await sb.from('products').insert({
          name_fr: p.name_fr,
          name_en: p.name_en,
          name_ar: p.name_ar,
          description_fr: p.desc_fr,
          description_en: p.desc_en,
          description_ar: p.desc_ar,
          price: p.price,
          compare_at_price: p.old_price,
          photos: p.photos,
          sizes: p.sizes,
          category_id: catId,
          featured: p.featured,
          active: true,
          stock: 20,
        }).select('id');
        if (error) { msg(`  ✗ ${p.name_fr}: ${error.message}`, 'err'); continue; }
        msg(`  ✓ ${p.name_fr} (id: ${data?.[0]?.id})`);
      }

      msg('\n🎉 Done! Close this page and refresh the store.', 'done');
      btn.textContent = 'Done!';
