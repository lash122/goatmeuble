<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page introuvable — GOAT meubles</title>
  <meta name="robots" content="noindex">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600&family=Inter:wght@400;500;600;700&family=Cairo:wght@400;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
  <!-- Root-absolute, not relative. A 404 is served AT the URL that failed, so
       this page can render at any depth — "css/style.css" from /p/99 resolves
       to /p/css/style.css and 404s too, leaving unstyled text on a broken
       page, which is the worst possible moment to look broken. -->
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="/icon-180.png">
  <meta name="theme-color" content="#3b2f26">
  <link rel="stylesheet" href="/css/style.css?v=201">
  <link rel="stylesheet" href="/css/theme-furniture.css?v=201">
  <!-- Deliberately no Supabase, no config, no app JS: the one job of this page
       is to load when something else did not. A trilingual static message
       costs nothing and cannot itself fail. -->
</head>
<body>
  <div class="topbar" data-i18n="cod_only"></div>

  <header class="site">
    <div class="container site-inner">
      <a class="brand" href="/">
        <img src="/assets/logo-goat.jpg" alt="GOAT meubles" style="height:36px;width:auto;object-fit:contain"><span class="brand-name">GOAT meubles</span>
      </a>
    </div>
  </header>

  <main class="container" style="text-align:center;padding:90px 20px 110px">
    <div style="font-family:'Playfair Display',Georgia,serif;font-size:clamp(64px,14vw,120px);line-height:1;color:var(--gold)">404</div>

    <p style="font-size:20px;margin:18px 0 6px">Cette page n'existe pas.</p>
    <p style="color:var(--muted);margin:0 0 4px" dir="rtl" lang="ar">هذه الصفحة غير موجودة.</p>
    <p style="color:var(--muted);margin:0 0 34px" lang="en">This page does not exist.</p>

    <div style="display:flex;gap:12px;justify-content:center;flex-wrap:wrap">
      <a class="btn-gold" href="/">Retour à la boutique</a>
      <a class="btn-outline" href="/track.html">Suivre ma commande</a>
    </div>
  </main>

  <footer class="site">
    <div class="container">
      <div class="fine"><span id="year"></span> — GOAT meubles</div>
    </div>
  </footer>
  <script>document.getElementById('year').textContent = new Date().getFullYear();</script>
</body>
</html>
